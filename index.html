<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Hub | Sign in</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body class="login-bg">
  <main class="login-container">
    <p class="eyebrow">WELCOME TO</p>
    <h1>NOVEL HUB</h1>
    <p>Sign in to browse your bookshelf.</p>
    <form id="loginForm">
      <label for="username">Your name</label>
      <input type="text" id="username" name="username" placeholder="Enter your name" autocomplete="name" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter any password" autocomplete="current-password" required>
      <button type="submit">Continue to the library</button>
    </form>
    <p class="login-note">This is a local demo sign-in. It does not create or verify an online account.</p>
    <p id="error-message" class="error-message" aria-live="polite"></p>
  </main>
  <script src="scripts1.js"></script>
</body>
</html>
